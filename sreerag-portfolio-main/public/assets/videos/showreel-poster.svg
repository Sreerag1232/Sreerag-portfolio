<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="vfx-bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#2a0914"/>
      <stop offset="60%" stop-color="#120309"/>
      <stop offset="100%" stop-color="#070104"/>
    </radialGradient>
    <linearGradient id="red-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF382E"/>
      <stop offset="100%" stop-color="#A51510"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#vfx-bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Optical Glow / Atmosphere -->
  <circle cx="960" cy="500" r="450" fill="#E5261F" opacity="0.08"/>

  <!-- Viewfinder / Camera Tracking Frame Corners -->
  <path d="M 120 180 L 120 120 L 180 120" fill="none" stroke="#E5261F" stroke-width="3" opacity="0.8"/>
  <path d="M 1800 180 L 1800 120 L 1740 120" fill="none" stroke="#E5261F" stroke-width="3" opacity="0.8"/>
  <path d="M 120 900 L 120 960 L 180 960" fill="none" stroke="#E5261F" stroke-width="3" opacity="0.8"/>
  <path d="M 1800 900 L 1800 960 L 1740 960" fill="none" stroke="#E5261F" stroke-width="3" opacity="0.8"/>

  <!-- Sub-pixel Tracking Crosshairs -->
  <g opacity="0.4" stroke="#ffffff" stroke-width="1">
    <line x1="960" y1="120" x2="960" y2="160"/>
    <line x1="960" y1="920" x2="960" y2="960"/>
    <line x1="120" y1="540" x2="160" y2="540"/>
    <line x1="1760" y1="540" x2="1800" y2="540"/>
    <!-- Center Target Crosshair -->
    <circle cx="960" cy="520" r="32" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line x1="960" y1="475" x2="960" y2="565" stroke="rgba(255,255,255,0.35)"/>
    <line x1="915" y1="520" x2="1005" y2="520" stroke="rgba(255,255,255,0.35)"/>
  </g>

  <!-- Big Cinematic Play Badge in Center -->
  <circle cx="960" cy="520" r="64" fill="rgba(18, 4, 10, 0.75)" stroke="rgba(255,255,255,0.85)" stroke-width="2.5"/>
  <polygon points="948,495 948,545 985,520" fill="#E5261F"/>

  <!-- Top Metadata Bar -->
  <text x="140" y="160" fill="rgba(255,255,255,0.5)" font-family="'Montserrat', sans-serif" font-size="16" font-weight="600" letter-spacing="4">3DEQUALIZER SOLVE // MAYA // CAMERA &amp; BODY TRACK</text>
  <text x="1780" y="160" text-anchor="end" fill="#E5261F" font-family="'Montserrat', sans-serif" font-size="16" font-weight="700" letter-spacing="3">24.000 FPS // 4K REEL</text>

  <!-- Bottom Title Block -->
  <g transform="translate(140, 890)">
    <rect x="-10" y="-30" width="220" height="30" rx="15" fill="rgba(229,38,31,0.2)" stroke="rgba(229,38,31,0.5)" stroke-width="1"/>
    <circle cx="5" cy="-15" r="4" fill="#E5261F"/>
    <text x="20" y="-10" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" letter-spacing="2">OFFICIAL VFX SHOWREEL</text>
    
    <text x="0" y="24" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="44" font-weight="800" letter-spacing="2">SREERAG RAJEEVAN</text>
    <text x="0" y="58" fill="rgba(255,255,255,0.7)" font-family="'Montserrat', sans-serif" font-size="20" font-weight="500" letter-spacing="1.5">SENIOR MATCHMOVE &amp; ROTOANIMATION ARTIST // 7 YEARS HOLLYWOOD VFX</text>
  </g>
</svg>
