<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#380a14"/>
      <stop offset="65%" stop-color="#140307"/>
      <stop offset="100%" stop-color="#080103"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF382E"/>
      <stop offset="100%" stop-color="#900E12"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Outer Frame -->
  <rect x="24" y="24" width="552" height="852" rx="32" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Top Metadata Header -->
  <text x="48" y="74" fill="#E5261F" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700" letter-spacing="3">ASTRA STUDIOS</text>
  <rect x="440" y="56" width="112" height="26" rx="13" fill="rgba(229,38,31,0.15)" stroke="#E5261F" stroke-width="1"/>
  <circle cx="454" cy="69" r="4" fill="#E5261F"/>
  <text x="466" y="74" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">ACTIVE</text>

  <!-- Central WIP Cinematic Radar / Lens Solve Graphic -->
  <g transform="translate(300, 370)">
    <!-- Outer dashed tracking circle -->
    <circle cx="0" cy="0" r="150" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="8 10" opacity="0.6"/>
    <!-- Middle precision circle -->
    <circle cx="0" cy="0" r="105" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <!-- Inner solid circle -->
    <circle cx="0" cy="0" r="60" fill="rgba(229,38,31,0.08)" stroke="rgba(229,38,31,0.5)" stroke-width="1.5"/>

    <!-- Crosshair tracking lines -->
    <line x1="-180" y1="0" x2="180" y2="0" stroke="rgba(229,38,31,0.4)" stroke-width="1"/>
    <line x1="0" y1="-180" x2="0" y2="180" stroke="rgba(229,38,31,0.4)" stroke-width="1"/>

    <!-- Corner brackets -->
    <path d="M -80 -50 L -80 -80 L -50 -80" fill="none" stroke="#E5261F" stroke-width="2"/>
    <path d="M 80 -50 L 80 -80 L 50 -80" fill="none" stroke="#E5261F" stroke-width="2"/>
    <path d="M -80 50 L -80 80 L -50 80" fill="none" stroke="#E5261F" stroke-width="2"/>
    <path d="M 80 50 L 80 80 L 50 80" fill="none" stroke="#E5261F" stroke-width="2"/>

    <!-- Center pulse dot -->
    <circle cx="0" cy="0" r="12" fill="#E5261F"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#E5261F" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Title & WIP Details -->
  <g transform="translate(300, 600)">
    <!-- NDA Badge -->
    <rect x="-110" y="-34" width="220" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="0" y="-16" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" letter-spacing="2.5">UNDER STRICT NDA</text>

    <!-- Main Title -->
    <text x="0" y="32" text-anchor="middle" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="34" font-weight="900" letter-spacing="2">WORK IN PROGRESS</text>
    <text x="0" y="68" text-anchor="middle" fill="#E5261F" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700" letter-spacing="3.5">HOLLYWOOD FEATURE / SERIES</text>
    <text x="0" y="104" text-anchor="middle" fill="rgba(255,255,255,0.65)" font-family="'Montserrat', sans-serif" font-size="12" font-weight="500" letter-spacing="2">LEAD MATCHMOVE &amp; ROTOANIMATION</text>

    <!-- Status Button -->
    <rect x="-105" y="140" width="210" height="42" rx="21" fill="rgba(229,38,31,0.18)" stroke="#E5261F" stroke-width="1.5"/>
    <circle cx="-65" cy="161" r="5" fill="#E5261F"/>
    <text x="10" y="166" text-anchor="middle" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" letter-spacing="2">IN PRODUCTION</text>
  </g>
</svg>